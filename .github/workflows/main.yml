name: Build Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Organize Project Structure
      run: |
        # 1. Ensure app directory exists
        mkdir -p app/src/main/java
        mkdir -p app/src/main/res
        mkdir -p gradle/wrapper

        # 2. Move Kotlin source files to java folder
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/ \;

        # 3. Move AndroidManifest.xml if at root
        if [ -f "AndroidManifest.xml" ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # 4. Move Gradle wrapper properties if present
        if [ -f "gradle-wrapper.properties" ]; then
          mv gradle-wrapper.properties gradle/wrapper/
        fi

        # 5. Move app build.gradle.kts
        if [ -f "build.gradle.kts" ] && [ ! -f "app/build.gradle.kts" ]; then
          cp build.gradle.kts app/
        fi

        # 6. Generate gradle wrapper
        gradle wrapper
        chmod +x gradlew

    - name: Build Release AAB
      run: ./gradlew bundleRelease --stacktrace || ./gradlew assembleRelease --stacktrace

    - name: Upload AAB/APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
          **/build/outputs/**/*.aab
          **/build/outputs/**/*.apk
